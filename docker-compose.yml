services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-save json-server@0.17.4 &&
      ./node_modules/.bin/json-server
      --watch db.json --host 0.0.0.0 --port 3001"
    volumes:
      - ./db.json:/app/db.json
    expose:
      - "3001"
    restart: unless-stopped